<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusAI - Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="register-section">
        <h1>📝 Create Student Account</h1>
        <p class="section-subtitle">Unlock AI career guidance, discover matching internships, and track your achievements.</p>

        <div class="register-box">
            <!-- Google OAuth Sign-in Button -->
            <button type="button" class="btn-google-auth" onclick="signInWithGoogle()" id="googleRegisterBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                </svg>
                <span>Sign up with Google</span>
            </button>

            <div class="auth-divider">
                <span>OR REGISTER WITH EMAIL</span>
            </div>

            <form onsubmit="event.preventDefault(); registerUser();">
                <div class="form-group">
                    <label for="registerName">Full Name</label>
                    <input
                        type="text"
                        id="registerName"
                        placeholder="e.g. Alex Johnson"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="registerEmail">University or Personal Email</label>
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="alex@university.edu"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="registerPassword">Create Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="At least 6 characters"
                        autocomplete="new-password"
                        required
                        minlength="6"
                    >
                    <span class="field-hint">Use 6 or more characters with letters &amp; numbers.</span>
                </div>

                <button type="submit">
                    Create Account &amp; Setup Profile →
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px;">
                <p style="font-size: 14px; color: #666; margin-bottom: 8px;">Already have an account?</p>
                <button type="button" class="btn-secondary-action" onclick="window.location.href='login.html'" style="margin-top: 0;">
                    🔐 Login
                </button>
            </div>
        </div>
    </section>

    <footer class="campus-footer">
        <p>&copy; 2026 CampusAI. University Career Acceleration with Supabase &amp; Google Auth.</p>
    </footer>

    <!-- Supabase JS Client & Auth Integration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseConfig.js"></script>
    <script src="script.js"></script>
</body>

</html>
