<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusAI - Verified Campus Opportunities</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="opportunities">
        <h1 id="categoryTitle">🚀 Featured Campus Opportunities</h1>
        <p class="section-subtitle">
            Curated high-impact opportunities with verified stipends, awards, and industry mentorship.
        </p>

        <!-- TOP BAR WITH FILTERS & SEARCH -->
        <div class="opportunities-top-bar">
            <div class="filter-pills">
                <button class="filter-pill active" onclick="selectOpportunityCategory('All', this)">All</button>
                <button class="filter-pill" onclick="selectOpportunityCategory('Hackathon', this)">💻 Hackathons</button>
                <button class="filter-pill" onclick="selectOpportunityCategory('Internship', this)">🚀 Internships</button>
                <button class="filter-pill" onclick="selectOpportunityCategory('Workshop', this)">🎓 Workshops</button>
                <button class="filter-pill" onclick="selectOpportunityCategory('Competition', this)">🏆 Competitions</button>
                <button class="filter-pill" onclick="selectOpportunityCategory('Scholarship', this)">💰 Scholarships</button>
            </div>

            <div class="search-input-box">
                <span class="search-icon">🔍</span>
                <input
                    type="text"
                    id="opportunitySearch"
                    placeholder="Search by role, city, or skill (e.g. Bangalore, AI, Python)..."
                    oninput="loadOpportunities()"
                >
            </div>
        </div>

        <div class="cards" id="opportunityCards">
            <!-- Dynamic opportunities rendered by script.js -->
        </div>
    </section>

    <!-- OPPORTUNITY QUICK VIEW MODAL OVERLAY -->
    <div id="opportunityQuickModal" class="modal-overlay">
        <div class="modal-box" style="max-width: 620px;">
            <div class="modal-header">
                <h3 style="display:flex; align-items:center; gap:8px;">
                    <span id="quickModalIcon">🚀</span>
                    <span id="quickModalHeading">Opportunity Details</span>
                </h3>
                <button type="button" class="modal-close-btn" onclick="closeModal('opportunityQuickModal')" aria-label="Close modal">✕</button>
            </div>
            <div id="quickModalContent" style="font-size:14px; line-height:1.6; color:#444;">
                Loading opportunity details...
            </div>
            <div style="display:flex; gap:12px; margin-top:24px;">
                <button type="button" class="btn-primary-action" id="quickModalApplyBtn" style="margin:0; flex:1;">
                    📝 Apply for Opportunity →
                </button>
                <button type="button" class="btn-nav-action btn-nav-outline" onclick="closeModal('opportunityQuickModal')" style="margin:0;">
                    Close
                </button>
            </div>
        </div>
    </div>

    <footer class="campus-footer">
        <p>&copy; 2026 CampusAI. Connected to verified university partners.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        function selectOpportunityCategory(category, btn) {
            localStorage.setItem("selectedInterest", category);
            document.querySelectorAll(".filter-pills .filter-pill").forEach(p => p.classList.remove("active"));
            if (btn) btn.classList.add("active");
            loadOpportunities();
        }
    </script>
</body>

</html>
